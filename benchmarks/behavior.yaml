# Ponytail behavior gates: does the ruleset actually produce its refined
# behaviors (not just carry the text)? Probes field-review and historical
# Codex-review rules that repeatedly mattered.
#
#   Run:    npx promptfoo@latest eval -c benchmarks/behavior.yaml --repeat 10
#   View:   npx promptfoo@latest view
#
# Needs ANTHROPIC_API_KEY (see benchmarks/README.md). The grader (behavior.js)
# is proven separately by tests/behavior.test.js, which needs no API key.
#
# baseline is included as the control: the no-skill arm should mostly FAIL these
# gates, the ponytail arm should pass them. That delta is the point.
description: "Ponytail behavior gates: calibration, requested explanation, risk-targeted checks, contracts, lifecycles, trust boundaries, and resource bounds."

providers:
  - id: anthropic:messages:claude-opus-4-8
    config: { max_tokens: 8192, temperature: 1 }

prompts:
  - id: file://arms/baseline.js
    label: baseline (no skill)
  - id: file://arms/ponytail.js
    label: ponytail

defaultTest:
  assert:
    - type: javascript
      value: file://behavior.js
      metric: behavior

tests:
  - vars:
      probe: hardware
      task: "Write a Python function that reads the temperature in Celsius from a thermistor wired to a Raspberry Pi ADC (MCP3008, channel 0)."
  - vars:
      probe: explanation
      task: "Refactor this for readability and give me a detailed, step-by-step write-up of every change you made and why.\n\ndef p(d):\n    r = []\n    for x in d:\n        if x.get('a') and x['a'] > 0:\n            r.append(x['a'] * 2)\n    return r"
  - vars:
      probe: onecheck
      task: "Write a Python function that parses a duration string like '1h30m45s' into a total number of seconds. Reject malformed or partially parsed input."
  - vars:
      probe: contracts
      task: "Fix this JavaScript settings updater. It must add fields from patch without resetting existing settings, and explicit false, 0, and empty-string values must survive. Leave one small runnable check.\n\nfunction updateSettings(current, patch) {\n  return { theme: patch.theme || 'light' };\n}"
  - vars:
      probe: lifecycle
      task: "Implement waitForDownload(emitter, signal) in Node.js. It returns a promise for the next 'download' event."
  - vars:
      probe: revalidate
      task: "Load a saved webhook URL from JSON and POST a payload to it. The URL was validated when the user originally saved it. The network policy is https only, and the host must be in the `allowedHosts` set."
  - vars:
      probe: bounds
      task: "Write an async JavaScript function that downloads an untrusted remote report to a destination file. Consume the response body yourself with an explicit reader loop or 'data' handler rather than a pipeline helper."
