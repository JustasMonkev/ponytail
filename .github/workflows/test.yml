name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps for correctness checks
        run: pip install pandas

      - name: Install MCP deps
        run: npm install --prefix ponytail-mcp

      - name: Check rule copies
        run: node scripts/check-rule-copies.js

      - name: Check version consistency
        run: node scripts/check-versions.js

      - name: Run tests
        run: npm test

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go/go.mod

      # Node is already installed above, so the differential tests in go/ run
      # for real here rather than skipping themselves.
      - name: Run Go tests
        run: go test ./...
        working-directory: go

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        working-directory: go

      - name: Check the generated fallback is in sync
        run: |
          node scripts/gen-go-fallback.js
          git diff --exit-code go/internal/instructions/fallback_gen.go
